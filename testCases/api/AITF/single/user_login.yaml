module: AITF用户接口
api_desc: 用户登录
controller: LoginView
api_name: post
cases:
  - case_id: API-LOGIN-001
    name: 使用 assets 默认 body 登录成功
    assertions:
      - type: status_code
        expected: 200


  - case_id: API-LOGIN-002
    name: 显式 body 登录并提取 token
    headers:
      Content-Type: application/json
    body:
      account: admin
      password: 123456
    assertions:
      - type: status_code
        expected: 200


