controller: ScheduleViewSet
apis:
  - name: list
    method: GET
    url: /api/schedules/
    headers:
      Authorization:
      X-Project-Code:

  - name: create
    method: POST
    url: /api/schedules/
    headers:
      Authorization:
      Content-Type: application/json
      X-Project-Code:
    body:
      type: object
      properties:
        execution_plan:
          type: integer
          default:
          description: 执行计划 ID
        name:
          type: string
          default:
          description: 调度名称
        schedule_type:
          type: string
          default: cron
          description: 枚举 cron/interval
        cron_expression:
          type: string
          default:
          description: Cron 表达式
        interval_seconds:
          type: integer
          default:
          description: 间隔秒数
        is_active:
          type: boolean
          default: true
          description: 是否启用

  - name: retrieve
    method: GET
    url: /api/schedules/{id}/
    headers:
      Authorization:
      X-Project-Code:

  - name: update
    method: PUT
    url: /api/schedules/{id}/
    headers:
      Authorization:
      Content-Type: application/json
      X-Project-Code:
    body:
      type: object
      properties:
        execution_plan:
          type: integer
          default:
          description: 执行计划 ID
        name:
          type: string
          default:
          description: 调度名称
        schedule_type:
          type: string
          default: cron
          description: 枚举 cron/interval
        cron_expression:
          type: string
          default:
          description: Cron 表达式
        interval_seconds:
          type: integer
          default:
          description: 间隔秒数
        is_active:
          type: boolean
          default: true
          description: 是否启用

  - name: partial_update
    method: PATCH
    url: /api/schedules/{id}/
    headers:
      Authorization:
      Content-Type: application/json
      X-Project-Code:
    body:
      type: object
      properties:
        execution_plan:
          type: integer
          default:
          description: 执行计划 ID
        name:
          type: string
          default:
          description: 调度名称
        schedule_type:
          type: string
          default: cron
          description: 枚举 cron/interval
        cron_expression:
          type: string
          default:
          description: Cron 表达式
        interval_seconds:
          type: integer
          default:
          description: 间隔秒数
        is_active:
          type: boolean
          default: true
          description: 是否启用

  - name: destroy
    method: DELETE
    url: /api/schedules/{id}/
    headers:
      Authorization:
      X-Project-Code:
