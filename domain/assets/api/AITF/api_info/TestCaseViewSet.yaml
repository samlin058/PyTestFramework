controller: TestCaseViewSet
apis:
  - name: list
    method: GET
    url: /api/testcases/
    headers:
      Authorization:
      X-Project-Code:

  - name: create
    method: POST
    url: /api/testcases/
    headers:
      Authorization:
      Content-Type: application/json
      X-Project-Code:

  - name: retrieve
    method: GET
    url: /api/testcases/{id}/
    headers:
      Authorization:
      X-Project-Code:

  - name: update
    method: PUT
    url: /api/testcases/{id}/
    headers:
      Authorization:
      Content-Type: application/json
      X-Project-Code:

  - name: partial_update
    method: PATCH
    url: /api/testcases/{id}/
    headers:
      Authorization:
      Content-Type: application/json
      X-Project-Code:

  - name: destroy
    method: DELETE
    url: /api/testcases/{id}/
    headers:
      Authorization:
      X-Project-Code:
