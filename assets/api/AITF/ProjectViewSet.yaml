controller: ProjectViewSet
apis:
  - name: list
    method: GET
    url: /api/projects/
    headers:
      Authorization:

  - name: create
    method: POST
    url: /api/projects/
    headers:
      Authorization:
      Content-Type: application/json
    body:
      type: object
      properties:
        name:
          type: string
          default:
          description: 项目名称
        code:
          type: string
          default:
          description: 项目编码
        description:
          type: string
          default:
          description: 项目描述

  - name: retrieve
    method: GET
    url: /api/projects/{id}/
    headers:
      Authorization:

  - name: update
    method: PUT
    url: /api/projects/{id}/
    headers:
      Authorization:
      Content-Type: application/json
    body:
      type: object
      properties:
        name:
          type: string
          default:
          description: 项目名称
        code:
          type: string
          default:
          description: 项目编码
        description:
          type: string
          default:
          description: 项目描述

  - name: partial_update
    method: PATCH
    url: /api/projects/{id}/
    headers:
      Authorization:
      Content-Type: application/json
    body:
      type: object
      properties:
        name:
          type: string
          default:
          description: 项目名称
        code:
          type: string
          default:
          description: 项目编码
        description:
          type: string
          default:
          description: 项目描述

  - name: destroy
    method: DELETE
    url: /api/projects/{id}/
    headers:
      Authorization:
