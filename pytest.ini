[pytest]
testpaths = application/testCases
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    # alluredir is pinned to <project>/reports/allure-results in pytest_configure
    --clean-alluredir
markers =
    smoke: smoke tests
    api: API tests
    ui: UI tests
    regression: regression tests
log_cli = false
filterwarnings =
    ignore::DeprecationWarning
