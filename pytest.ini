[pytest]
testpaths = testCases
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
markers =
    smoke: smoke tests
    api: API tests
    ui: UI tests
    regression: regression tests
log_cli = false
filterwarnings =
    ignore::DeprecationWarning
